<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<title>Registro</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
/* =========================================
   CORE VARIABLES & PALETTE
   ========================================= */
:root { 
  --ios-green: #34C759; 
  --ios-red: #FF3B30; 
  --ios-orange: #FF9500;
  --ios-accent: #007AFF; 
  --ios-accent-glow: rgba(0, 122, 255, 0.4);
  
  --ease-spring: cubic-bezier(0.25, 0.8, 0.25, 1);
  --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg-color); transition: background 0.4s ease; }

body { 
  min-height: 100vh; min-height: 100dvh; 
  padding: env(safe-area-inset-top, 20px) 16px calc(140px + env(safe-area-inset-bottom, 20px)); 
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif; 
  color: var(--text-main); -webkit-text-size-adjust: 100%; 
  -webkit-font-smoothing: antialiased; 
  -moz-osx-font-smoothing: grayscale;
}

/* =========================================
   THEMES SYSTEM (Variabili)
   ========================================= */

/* TEMA 1: VETRO */
body[data-theme="glass"] {
  --bg-color: transparent; --card-bg: rgba(255, 255, 255, 0.55); --card-border: rgba(255, 255, 255, 0.7);
  --card-shadow: 0 8px 32px rgba(31, 38, 135, 0.08); --card-blur: blur(30px); --control-bg: rgba(255, 255, 255, 0.4);
  --text-main: #1C1C1E; --text-sec: #6C6C70; --separator: rgba(0, 0, 0, 0.08); --radius-main: 24px; --radius-list: 24px;
  --hero-bg: linear-gradient(135deg, rgba(30,30,32,0.85) 0%, rgba(20,20,22,0.95) 100%); --hero-text: #FFFFFF;
  --hero-shadow: 0 24px 48px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.2);
  --tab-bg: rgba(255, 255, 255, 0.75); --tab-shadow: 0 20px 40px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.8);
  --tab-pos-b: max(20px, env(safe-area-inset-bottom)); --tab-pos-x: 20px; --tab-radius: 40px; --tab-label-display: flex;
  --panel-tint: rgba(0, 0, 0, 0.03);
}

/* TEMA 3: PRO UI/UX (ULTRA DARK) */
body[data-theme="expert"] {
  --bg-color: #050505; --card-bg: rgba(20, 20, 22, 0.7); --card-border: rgba(255,255,255,0.06);
  --card-shadow: 0 10px 40px rgba(0,0,0,0.5); --card-blur: blur(20px); --control-bg: rgba(30, 30, 35, 0.8);
  --text-main: #FFFFFF; --text-sec: #A1A1AA; --separator: rgba(255,255,255,0.05);
  --radius-main: 28px; --radius-list: 0px; --hero-bg: #111112; --hero-text: #FFFFFF; --hero-shadow: 0 20px 50px rgba(0,0,0,0.6);
  --tab-bg: rgba(10, 10, 12, 0.85); --tab-shadow: 0 20px 40px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05), inset 0 0 0 1px #27272A;
  --tab-pos-b: max(24px, env(safe-area-inset-bottom)); --tab-pos-x: 50%; --tab-radius: 50px; --tab-label-display: none;
  --panel-tint: rgba(255, 255, 255, 0.04);
}

/* TEMA 2: MINIMALE BRUTALISTA (Bianco/Nero/Grigio, Linee Nette) */
body[data-theme="minimal"] {
  --bg-color: #FFFFFF; --card-bg: #FFFFFF; --card-border: #000000; --card-shadow: none; --card-blur: none;
  --control-bg: #F4F4F4; --text-main: #000000; --text-sec: #666666; --separator: #E5E5E5; 
  --radius-main: 0px; --radius-list: 0px; --hero-bg: #FFFFFF; --hero-text: #000000; --hero-shadow: none;
  --tab-bg: #FFFFFF; --tab-shadow: none; --tab-pos-b: 0; --tab-pos-x: 0; --tab-radius: 0; --tab-label-display: flex;
  --panel-tint: rgba(0, 0, 0, 0.03);
}

/* =========================================
   OVERRIDE STRUTTURALI PER TEMA
   ========================================= */

/* --- GLI EFFETTI DEL TEMA EXPERT E GLASS --- */
.noise-overlay { display: none; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.02; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
.ambient-bg { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #E8E8ED; }
body[data-theme="expert"] .noise-overlay { display: block; }
body[data-theme="glass"] .ambient-bg { display: block; }
body[data-theme="glass"] .hero-balance-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 0%, transparent 40%); pointer-events: none; display: block; }

body[data-theme="expert"] .hero-balance-card { padding: 1px; border: none; overflow: hidden; box-shadow: 0 0 30px var(--ios-accent-glow); }
body[data-theme="expert"] .hero-card-content { background: rgba(15,15,18,0.95); border-radius: calc(var(--radius-main) - 1px); backdrop-filter: blur(20px); z-index: 2; position: relative; }
body[data-theme="expert"] .hero-balance-card .glow-wrap { display: block; position: absolute; width: 250%; height: 250%; top: -75%; left: -75%; background: conic-gradient(from 0deg, transparent 70%, var(--ios-accent) 100%); animation: spinGlow 4s linear infinite; z-index: 1; }
@keyframes spinGlow { 100% { transform: rotate(360deg); } }
body[data-theme="expert"] .hero-balance-value { background: linear-gradient(110deg, #FFFFFF 0%, #71717A 40%, #FFFFFF 60%, #71717A 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: holoShine 5s ease-in-out infinite alternate; text-shadow: none; }
@keyframes holoShine { from { background-position: 0% center; } to { background-position: 200% center; } }
body[data-theme="expert"] .hero-figures > div { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.04); box-shadow: none; }
body[data-theme="expert"] .wallet-stub { background: linear-gradient(135deg, #18181B, #09090B) !important; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
body[data-theme="expert"] .wallet-stub::before { content: ''; position: absolute; inset: 0; opacity: 0.15; background-image: radial-gradient(rgba(255,255,255,0.6) 1px, transparent 1px); background-size: 5px 5px; pointer-events: none; }
body[data-theme="expert"] .wallet-stub::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; top: auto; height: 3px; background: var(--wc); box-shadow: 0 -4px 20px var(--wc); opacity: 0.85; }
body[data-theme="expert"] .wallet-stub-active { outline-color: var(--ios-accent); box-shadow: 0 20px 40px var(--ios-accent-glow); }
body[data-theme="expert"] .ios-list { background: transparent; border: none; box-shadow: none; backdrop-filter: none; display: flex; flex-direction: column; gap: 12px; padding:0; }
body[data-theme="expert"] .ios-list-item, body[data-theme="expert"] .tx-swipe-wrapper { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; margin: 0; }
body[data-theme="expert"] .ios-list-item { padding: 20px; }
body[data-theme="expert"] .chip { background: #1E1E20; border: 1px solid #27272A; }
body[data-theme="expert"] canvas { filter: drop-shadow(0 0 16px var(--ios-accent-glow)); }
body[data-theme="expert"] .tab-bar { left: 50%; right: auto; width: max-content; transform: translateX(-50%); padding: 10px 16px; gap: 14px; }
body[data-theme="expert"] .tab-bar button { padding: 12px; border-radius: 50%; max-width: none; flex: 0 0 auto; background: transparent; }
body[data-theme="expert"] .tab-bar button.tab-active { background: rgba(255,255,255,0.1); color: var(--ios-accent); box-shadow: 0 4px 12px var(--ios-accent-glow), inset 0 1px 0 rgba(255,255,255,0.1); }
body[data-theme="expert"] .tab-bar button.tab-active svg { transform: scale(1.1); filter: none; }

/* --- IL NUOVO TEMA MINIMALE (Brutalista) --- */
body[data-theme="minimal"] .ambient-bg { display: none; }
body[data-theme="minimal"] .hero-balance-card { padding: 0 0 24px 0; border: none; box-shadow: none; margin-bottom: 24px; border-bottom: 2px solid #000; border-radius: 0; }
body[data-theme="minimal"] .hero-card-content { padding: 0; background: transparent; }
body[data-theme="minimal"] .glow-wrap { display: none; }
body[data-theme="minimal"] .hero-balance-value { font-size: 64px; letter-spacing: -3px; color: #000 !important; text-shadow: none; margin-bottom: 4px; font-weight: 800;}
body[data-theme="minimal"] .hero-balance-label { display: none; } /* Nasconde testo superfluo */
body[data-theme="minimal"] .hero-delta { background: transparent; border: none; padding: 0; color: #666 !important; font-weight: 500; font-size: 15px; margin:0;}
body[data-theme="minimal"] .hero-delta.pos, body[data-theme="minimal"] .hero-delta.neg { color: #000 !important; }
body[data-theme="minimal"] .hero-figures { gap: 0; margin-top: 16px; border-top: 1px solid #E5E5E5; padding-top: 16px;}
body[data-theme="minimal"] .hero-figures > div { background: transparent; border: none; box-shadow: none; padding: 0; border-left: 1px solid #000; border-radius: 0; padding-left: 16px; margin-left:16px;}
body[data-theme="minimal"] .hero-figures > div:first-child { border-left: none; padding-left: 0; margin-left:0;}
body[data-theme="minimal"] .hero-figure-label { color: #666; font-size: 11px; letter-spacing:1px; text-transform:uppercase; margin-bottom:2px;}
body[data-theme="minimal"] .hero-figure-value { color: #000 !important; font-size: 22px; letter-spacing: -1px; font-weight:700;}

body[data-theme="minimal"] .period-tabs { border: 1px solid #000; border-radius: 0; padding: 0; background: #fff; box-shadow:none;}
body[data-theme="minimal"] .period-tabs button { border-radius: 0; color: #666; border-right: 1px solid #000; padding: 10px 0; }
body[data-theme="minimal"] .period-tabs button:last-child { border-right: none; }
body[data-theme="minimal"] .period-tabs button.period-active { background: #000; color: #fff; box-shadow: none; }
body[data-theme="minimal"] .period-nav { border: 1px solid #000; border-radius: 0; background: #fff; box-shadow: none; padding: 4px 8px; }
body[data-theme="minimal"] .period-nav button.nav-arrow { background: transparent; color: #000; }
body[data-theme="minimal"] .btn-today { border-radius: 0; border: 1px solid #000; color: #000; background: transparent; box-shadow:none;}

body[data-theme="minimal"] .wallet-stub { background: #fff !important; border: 1px solid #000; border-radius: 0; box-shadow: none; min-width: 140px; height: 110px; padding: 16px; }
body[data-theme="minimal"] .wallet-stub::after { display: none; }
body[data-theme="minimal"] .wallet-stub-name { color: #666; text-shadow: none; font-size: 13px; }
body[data-theme="minimal"] .wallet-stub-balance { color: #000; text-shadow: none; font-size: 24px; }
body[data-theme="minimal"] .wallet-stub-active { outline: none; background: #000 !important; transform: none; box-shadow:none;}
body[data-theme="minimal"] .wallet-stub-active .wallet-stub-name { color: #aaa; }
body[data-theme="minimal"] .wallet-stub-active .wallet-stub-balance { color: #fff; }
body[data-theme="minimal"] .wallet-add-stub { border: 1px dashed #000; border-radius: 0; background: transparent; color: #000; height: 110px; min-width: 110px; }

body[data-theme="minimal"] .ios-list { background: #fff; border: 1px solid #000; border-radius: 0; box-shadow: none; backdrop-filter: none; }
body[data-theme="minimal"] .ios-list-item { padding: 16px; border-bottom: 1px solid #E5E5E5; }
body[data-theme="minimal"] .ios-list-item label { color: #000; font-weight:700; }
body[data-theme="minimal"] .ios-list-item input, body[data-theme="minimal"] .ios-list-item select, body[data-theme="minimal"] .amount-wrap input { color: #000; font-family: ui-monospace, "SF Mono", monospace; }

body[data-theme="minimal"] .cat-icon, body[data-theme="minimal"] .select-icon-badge { background: #fff !important; border: 1px solid #000; color: #000; box-shadow: none; border-radius: 0; filter: grayscale(100%); }
body[data-theme="minimal"] .select-color-dot { background: #000 !important; border-radius: 0; width: 12px; height: 12px; box-shadow: none; }

body[data-theme="minimal"] .tx-swipe-wrapper { border: none; border-bottom: 1px solid #E5E5E5; border-radius: 0; box-shadow: none; margin: 0; }
body[data-theme="minimal"] .tx-main-content { padding: 16px 0; }
body[data-theme="minimal"] .tx-cat { color: #000; font-size: 16px; }
body[data-theme="minimal"] .tx-amt { color: #000 !important; font-size: 18px; }
body[data-theme="minimal"] .tx-meta { color: #666; font-size: 12px; }
body[data-theme="minimal"] .tx-meta .tag { border: 1px solid #ccc; background: transparent; border-radius: 0; color:#000;}
body[data-theme="minimal"] .tx-actions button { border-radius:0; border:1px solid #000; background:transparent;}

body[data-theme="minimal"] .tab-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; backdrop-filter: none; border-radius: 0; box-shadow: none; border: none; border-top: 1px solid #000; padding: 0; padding-bottom: env(safe-area-inset-bottom); width: 100%; transform: none; display: flex; }
body[data-theme="minimal"] .tab-bar button { padding: 12px 0; border-right: 1px solid #E5E5E5; border-radius: 0; gap:2px;}
body[data-theme="minimal"] .tab-bar button:last-child { border-right: none; }
body[data-theme="minimal"] .tab-bar button.tab-active { background: #000; color: #fff; box-shadow: none; }
body[data-theme="minimal"] .tab-bar button.tab-active svg { filter: none; transform: none; }

body[data-theme="minimal"] .segmented { background: transparent; border: 1px solid #000; border-radius: 0; padding: 0; box-shadow: none; }
body[data-theme="minimal"] .segmented button { border-radius: 0; border-right: 1px solid #000; color: #666; padding: 12px; }
body[data-theme="minimal"] .segmented button:last-child { border-right: none; }
body[data-theme="minimal"] .segmented button.seg-active { background: #000; color: #fff; box-shadow: none; }

body[data-theme="minimal"] .btn-primary { background: #000; color: #fff; border-radius: 0; box-shadow: none; border: 1px solid #000; }
body[data-theme="minimal"] .btn-ghost { background: transparent; border: 1px solid #000; color: #000; border-radius: 0; box-shadow: none; }
body[data-theme="minimal"] .btn-small { border-radius: 0; background: #000; box-shadow: none; border: 1px solid #000; color: #fff;}
body[data-theme="minimal"] .btn-small.btn-ghost { background: transparent; color:#000; }
body[data-theme="minimal"] .btn-swipe-edit, body[data-theme="minimal"] .btn-swipe-del { border-left:1px solid #000;}

body[data-theme="minimal"] .filters select, body[data-theme="minimal"] .btn-filter { border-radius: 0; border: 1px solid #000; background: #fff; box-shadow: none; color: #000; }
body[data-theme="minimal"] .chip { border-radius: 0; border: 1px solid #000; background: transparent; color: #000; box-shadow: none; }
body[data-theme="minimal"] .chip-add-wrap input { border-radius: 0; border: 1px solid #000; background: transparent; color: #000; }
body[data-theme="minimal"] .chip-add-wrap button { border-radius: 0; background: #000; color: #fff; border: 1px solid #000; box-shadow: none; }

body[data-theme="minimal"] .breakdown-block { border-radius: 0; border: 1px solid #000; box-shadow: none; background: transparent; }
body[data-theme="minimal"] canvas { filter: grayscale(100%) contrast(1.2); }
body[data-theme="minimal"] .empty-state, body[data-theme="minimal"] .empty-mini { font-family: ui-monospace, "SF Mono", monospace; font-style: normal; text-transform: uppercase; font-size: 13px; color: #000; letter-spacing: 1px;}
body[data-theme="minimal"] .swipe-hint { display: none; } /* Nascondi hint testuale */

/* =========================================
   UI COMPONENTS & LAYOUT STANDARD
   ========================================= */
button, input, select { transition: transform 0.25s var(--ease-spring), opacity 0.25s, background 0.25s, box-shadow 0.25s; }
button:not(:disabled):active { transform: scale(0.96); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:not(:disabled):hover { filter: brightness(1.08); }
  .btn-ghost:not(:disabled):hover { background: var(--card-bg); }
  .wallet-stub:hover { transform: translateY(-3px); box-shadow: 0 16px 32px rgba(0,0,0,0.2); }
  .chroma-btn:hover { transform: scale(1.12); }
  .tab-bar button:not(.tab-active):hover { color: var(--text-main); }
  .nav-arrow:hover { background: var(--card-bg); }
}
.receipt { position: relative; max-width: 600px; margin: 0 auto; padding: 16px 0 0; }

.ambient-blob { position: absolute; border-radius: 50%; filter: blur(65px); animation: floatBlob 18s infinite ease-in-out alternate; }
.blob-1 { top: -20%; left: -10%; width: 70vw; height: 70vw; background: rgba(10, 132, 255, 0.45); } 
.blob-2 { top: 30%; right: -20%; width: 80vw; height: 80vw; background: rgba(191, 90, 242, 0.35); animation-delay: -5s; } 
.blob-3 { bottom: -20%; left: 10%; width: 90vw; height: 90vw; background: rgba(255, 55, 95, 0.35); animation-delay: -10s; } 
@keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 33% { transform: translate(40px, -60px) scale(1.15); } 66% { transform: translate(-30px, 30px) scale(0.9); } 100% { transform: translate(0, 0) scale(1); } }

.setup-banner, .sync-banner { 
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; 
  font-size: 14px; font-weight: 500; color: var(--text-sec); margin-bottom: 24px; 
  background: var(--card-bg); backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur);
  padding: 14px 18px; border-radius: var(--radius-main); box-shadow: var(--card-shadow); border: 1px solid var(--card-border);
  animation: slideDownFade 0.6s var(--ease-smooth);
}
.sync-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-sec); flex: 0 0 auto; }
.sync-dot.ok { background: var(--ios-green); box-shadow: 0 0 10px rgba(52, 199, 89, 0.4); }

.hero-top { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; animation: fadeIn 0.8s ease; }
.wordmark { font-weight: 800; font-size: 38px; margin: 0; letter-spacing: -0.04em; color: var(--text-main); text-shadow: 0 2px 10px rgba(0,0,0,0.05); }

.hero-balance-card { background: var(--hero-bg); backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur); color: var(--hero-text); border-radius: var(--radius-main); margin-bottom: 30px; box-shadow: var(--hero-shadow); position: relative; }
.hero-card-content { padding: 28px 24px; position: relative; z-index: 2; border-radius: inherit; }
.hero-balance-label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 1.2px; }
.hero-balance-value { font-weight: 700; font-size: 52px; letter-spacing: -2px; line-height: 1; display: block; margin-bottom: 16px; text-shadow: 0 4px 16px rgba(0,0,0,0.25); transition: 0.3s; }
.hero-balance-value.flash { animation: popGlow 0.5s var(--ease-spring); }

.btn-privacy { background: transparent; border: none; font-size: 22px; line-height: 1; padding: 6px; cursor: pointer; opacity: 0.75; }
.btn-privacy:active { transform: scale(0.9); }

.amount-blur { transition: filter 0.25s var(--ease-smooth), opacity 0.25s ease; display: inline-block; }
body.privacy-on .amount-blur { filter: blur(14px); opacity: 0.85; user-select: none; -webkit-user-select: none; }

/* --- BLOCCO FACE ID / PASSWORD --- */
.lock-screen { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 40px 20px; animation: slideUpFade 0.5s var(--ease-spring); }
.lock-icon { font-size: 56px; margin-bottom: 4px; }
.lock-title { font-size: 22px; font-weight: 800; color: var(--text-main); margin: 0; letter-spacing: -0.3px; }
.lock-sub { font-size: 15px; color: var(--text-sec); margin: 0 0 10px; }
.lock-error { color: var(--ios-red); font-size: 14px; font-weight: 600; margin: 0 0 4px; }
.lock-pass-wrap { width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.lock-pass-wrap input { padding: 16px 18px; border-radius: var(--radius-main); border: 1px solid var(--card-border); background: var(--control-bg); color: var(--text-main); font-size: 17px; text-align: center; outline: none; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
.lock-pass-wrap input:focus { border-color: var(--ios-accent); }
.lock-status-hint { font-size: 13px; color: var(--text-sec); padding: 14px 22px 0; margin: 0; }
.form-error { color: var(--ios-red); font-weight: 600; font-size: 14px; margin: 4px 0 0; padding: 0 22px; }

.hero-figures { display: flex; gap: 14px; margin-top: 24px;}
.hero-figures > div { flex: 1; background: rgba(255,255,255,0.08); padding: 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); }
.hero-figure-label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.5); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;}
.hero-figure-value { font-weight: 700; font-size: 20px; letter-spacing: -0.5px; transition: 0.3s;}
.hero-figure-value.pos { color: var(--ios-green); } .hero-figure-value.neg { color: var(--hero-text); }

.period-tabs { display: flex; background: var(--control-bg); backdrop-filter: var(--card-blur); border-radius: 14px; padding: 4px; margin-bottom: 16px; width: 100%; border: 1px solid var(--card-border); box-shadow: var(--card-shadow);}
.period-tabs button { flex: 1; padding: 10px 0; font-size: 14px; font-weight: 600; background: transparent; border: none; color: var(--text-sec); border-radius: 10px; transition: 0.3s var(--ease-spring); }

<script>
// ==========================================
// 1. SISTEMA HAPTIC & GESTIONE TEMA E CHROMA
// ==========================================
function haptic(type = 'light') {
  if (typeof navigator !== 'undefined' && navigator.vibrate) {
    try {
      if (type === 'light') navigator.vibrate(15);
      else if (type === 'heavy') navigator.vibrate(40);
      else if (type === 'success') navigator.vibrate([15, 60, 20]);
    } catch(e) {}
  }
}

let currentTheme = localStorage.getItem('registro-theme') || 'expert';
let currentChroma = localStorage.getItem('registro-chroma') || '#007AFF';
let currentGlow = localStorage.getItem('registro-glow') || 'rgba(0, 122, 255, 0.4)';
let privacyMode = localStorage.getItem('registro-privacy') === 'true';

// --- BLOCCO FACE ID / TOUCH ID (WebAuthn) + password di riserva ---
let lockEnabled = localStorage.getItem('registro-lock-enabled') === 'true';
let lockCredId = localStorage.getItem('registro-lock-cred-id') || null;
let lockPassHash = localStorage.getItem('registro-lock-pass-hash') || null;
let lockPassSalt = localStorage.getItem('registro-lock-pass-salt') || null;
let appUnlocked = !lockEnabled;
let webauthnAvailable = false;
let lockSetupOpen = false, lockDisableOpen = false;
let lockSetupError = null, lockDisableError = null;
let lockUsePasswordMode = false, lockScreenError = null, faceIdAutoTried = false;

function arrayBufferToBase64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function base64ToArrayBuffer(b64) { const bin = atob(b64); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return bytes.buffer; }
function genSaltHex() { const arr = crypto.getRandomValues(new Uint8Array(16)); return Array.from(arr).map((b) => b.toString(16).padStart(2, "0")).join(""); }
function hexToBytes(hex) { return new Uint8Array(hex.match(/.{1,2}/g).map((b) => parseInt(b, 16))); }
const PBKDF2_ITERATIONS = 210000;
async function hashPassword(password, saltHex) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: hexToBytes(saltHex), iterations: PBKDF2_ITERATIONS, hash: "SHA-256" }, keyMaterial, 256);
  return Array.from(new Uint8Array(bits)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
async function hashPasswordLegacySHA256(password, saltHex) { const enc = new TextEncoder(); const buf = await crypto.subtle.digest("SHA-256", enc.encode(saltHex + ":" + password)); return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join(""); }
async function verifyLockPassword(pw) {
  if (!pw || !lockPassHash || !lockPassSalt) return false;
  if (lockHashAlgo === "pbkdf2") return (await hashPassword(pw, lockPassSalt)) === lockPassHash;
  const legacyOk = (await hashPasswordLegacySHA256(pw, lockPassSalt)) === lockPassHash;
  if (legacyOk) {
    // migrazione trasparente: il primo sblocco riuscito con l'hash legacy ricalcola e salva un hash PBKDF2
    const upgraded = await hashPassword(pw, lockPassSalt);
    lockPassHash = upgraded; lockHashAlgo = "pbkdf2";
    localStorage.setItem('registro-lock-pass-hash', upgraded);
    localStorage.setItem('registro-lock-hash-algo', 'pbkdf2');
  }
  return legacyOk;
}

async function checkWebAuthnAvailability() {
  try {
    webauthnAvailable = !!(window.PublicKeyCredential && (await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()));
  } catch (e) { webauthnAvailable = false; }
  if (typeof renderAll === 'function') renderAll();
}

async function registerFaceId() {
  try {
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({ publicKey: {
      challenge, rp: { name: "Registro" }, user: { id: userId, name: "utente-locale", displayName: "Utente" },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
      timeout: 60000, attestation: "none"
    }});
    if (!cred) return false;
    lockCredId = arrayBufferToBase64(cred.rawId);
    localStorage.setItem('registro-lock-cred-id', lockCredId);
    return true;
  } catch (e) { console.error("WebAuthn create failed", e); return false; }
}

async function unlockWithFaceId() {
  if (!webauthnAvailable || !lockCredId) return;
  lockScreenError = null;
  try {
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const assertion = await navigator.credentials.get({ publicKey: {
      challenge, allowCredentials: [{ id: base64ToArrayBuffer(lockCredId), type: "public-key" }],
      userVerification: "required", timeout: 60000
    }});
    if (assertion) { appUnlocked = true; haptic('success'); renderAll(); }
  } catch (e) { lockScreenError = "Face ID non riuscito. Riprova o usa la password."; renderAll(); }
}

async function unlockWithPassword(pw) {
  if (!pw) { lockScreenError = "Inserisci la password."; renderAll(); return; }
  const ok = await verifyLockPassword(pw);
  if (ok) { appUnlocked = true; lockScreenError = null; haptic('success'); renderAll(); }
  else { lockScreenError = "Password errata."; haptic('heavy'); renderAll(); }
}

function renderLockScreenHTML() {
  return `
    <div class="lock-screen">
      <div class="lock-icon">🔒</div>
      <h1 class="lock-title">Registro Bloccato</h1>
      <p class="lock-sub">Sblocca per accedere ai tuoi dati.</p>

// creazione, o alla prima esecuzione per i dati storici). Modificare l'occorrenza piu' recente
// di una serie ne aggiorna il "modello" per le generazioni future; modificarne una passata resta
// isolato. "Interrompi serie" (stoppedSeriesIds) ferma solo le generazioni future, senza toccare
// lo storico gia' registrato.
function ensureSeriesIds() {
  let changed = false;
  const legacyGroups = new Map();
  data.transactions.forEach((t) => {
    if (t.type === "trasferimento" || t.frequency !== "fissa" || t.seriesId) return;
    const key = [t.type, t.category, t.wallet, t.note || "", t.amount].join("|");
    if (!legacyGroups.has(key)) legacyGroups.set(key, genId());
    t.seriesId = legacyGroups.get(key);
    changed = true;
  });
  if (changed) saveLocal();
}

function autoGenerateRecurring() {
  ensureSeriesIds();
  const stopped = new Set(data.stoppedSeriesIds || []);
  const today = startOfDay(new Date());
  const groups = new Map();
  data.transactions.forEach((t) => {
    if (t.type === "trasferimento" || t.frequency !== "fissa" || !t.seriesId || stopped.has(t.seriesId)) return;
    const cur = groups.get(t.seriesId);
    if (!cur || t.date > cur.date) groups.set(t.seriesId, t);
  });
  const additions = [];
  groups.forEach((last) => {
    let nextDate = addPeriod(parseISODate(last.date), "month", 1);
    let guard = 0;
    while (startOfDay(nextDate) <= today && guard < 24) {
      const iso = toISODate(nextDate);
      const sameSlot = (t) => t.seriesId === last.seriesId && t.date === iso;
      if (!data.transactions.some(sameSlot) && !additions.some(sameSlot)) {
        additions.push({ id: genId(), type: last.type, category: last.category, wallet: last.wallet, frequency: "fissa", amount: last.amount, currency: last.currency, seriesId: last.seriesId, date: iso, note: last.note || "", auto: true });
      }
      nextDate = addPeriod(nextDate, "month", 1);
      guard++;
    }
  });

    data = { ...data, transactions: [...data.transactions, ...additions] };

        Promise.all([
          ...localOnlyWallets.map((w) => fsSetDoc(fsDoc(db, "registro", uid, "wallets", w.id), w)),
          ...localOnlyTx.map((t) => fsSetDoc(fsDoc(db, "registro", uid, "transactions", t.id), t)),
        ]).catch((e) => console.error("Ri-sincronizzazione elementi locali fallita", e));
      }
    }

    onAuthStateChanged(authInstance, (user) => {
      if (!user) return;
      cloudUser = user; cloudReady = true;
      if (unsubSettings) unsubSettings(); if (unsubWallets) unsubWallets(); if (unsubTx) unsubTx();
      cloudSettings = null; cloudWallets = null; cloudTransactions = null; firstApplyDone = false;
      const uid = user.uid;

      unsubSettings = onSnapshot(doc(db, "registro", uid), { includeMetadataChanges: true }, async (snap) => {
        if (snap.exists()) {
          const raw = snap.data();
          if (Array.isArray(raw.wallets) || Array.isArray(raw.transactions)) {
            // formato precedente (un unico documento): migra una tantum verso le
            // sotto-collezioni, poi ripulisce i campi legacy dal documento principale.
            if (!snap.metadata.fromCache && !migrating) {
              migrating = true;
              try {
                const writes = [];
                (raw.wallets || []).forEach((w) => writes.push(setDoc(doc(db, "registro", uid, "wallets", w.id), w)));
                (raw.transactions || []).forEach((t) => writes.push(setDoc(doc(db, "registro", uid, "transactions", t.id), t)));
                await Promise.all(writes);
                await setDoc(doc(db, "registro", uid), { categories: raw.categories || { ...DEFAULT_CATEGORIES }, stoppedSeriesIds: raw.stoppedSeriesIds || [] });
              } catch (e) { console.error("Migrazione cloud fallita", e); }
              migrating = false;
            }
            cloudSettings = { categories: raw.categories || { ...DEFAULT_CATEGORIES }, stoppedSeriesIds: raw.stoppedSeriesIds || [] };
          } else {
            cloudSettings = raw;
          }
        } else {
          cloudSettings = { categories: data.categories || { ...DEFAULT_CATEGORIES }, stoppedSeriesIds: data.stoppedSeriesIds || [] };
          if (!snap.metadata.fromCache) {
            setDoc(doc(db, "registro", uid), cloudSettings);
            (data.wallets || []).forEach((w) => setDoc(doc(db, "registro", uid, "wallets", w.id), w));
            (data.transactions || []).forEach((t) => setDoc(doc(db, "registro", uid, "transactions", t.id), t));
          }
        }
        setSync(snap.metadata.hasPendingWrites || snap.metadata.fromCache ? "pending" : "ok");
        applyCloudState();
      }, () => setSync("error"));

      unsubWallets = onSnapshot(collection(db, "registro", uid, "wallets"), { includeMetadataChanges: true }, (qsnap) => {
        cloudWallets = qsnap.docs.map((d) => d.data());
        setSync(qsnap.metadata.hasPendingWrites || qsnap.metadata.fromCache ? "pending" : "ok");
        applyCloudState();
      }, () => setSync("error"));

      unsubTx = onSnapshot(collection(db, "registro", uid, "transactions"), { includeMetadataChanges: true }, (qsnap) => {
        cloudTransactions = qsnap.docs.map((d) => d.data());
        setSync(qsnap.metadata.hasPendingWrites || qsnap.metadata.fromCache ? "pending" : "ok");
        applyCloudState();
      }, () => setSync("error"));

      renderAll();
    });
    await signInAnonymously(authInstance);
  } catch (e) { console.error("Firebase init failed", e); }
}

function accountLabel() {
  if (!cloudUser) return "Non connesso";

}

function walletBalance(w) { return walletBalanceExcluding(w, null); }
function walletBalanceExcluding(w, excludeId) {
  const sum = data.transactions.reduce((acc, t) => {
    if (t.id === excludeId) return acc;
    if (t.type === "trasferimento") { if (t.fromWallet === w.name) return acc - t.amount; if (t.toWallet === w.name) return acc + (t.toAmount != null ? t.toAmount : t.amount); return acc; }
    return t.wallet === w.name ? acc + (t.type === "entrata" ? t.amount : -t.amount) : acc;
  }, 0); return (w.initialBalance || 0) + sum;
}
function walletByName(name) { return data.wallets.find((w) => w.name === name); }
function walletHasTransactions(name) { return data.transactions.some((t) => t.wallet === name || t.fromWallet === name || t.toWallet === name); }
function txCurrency(t) { if (t.currency) return t.currency; const w = walletByName(t.wallet); return (w && w.currency) || "EUR"; }
function amountInEUR(t) { if (t.type === "trasferimento") return 0; return toEUR(t.amount, txCurrency(t)); }

function renderTxRow(t, index = 0) {
  const delay = index * 0.03;
  let content = "";
  if (t.type === "trasferimento") {
    const fromCur = t.fromCurrency || "EUR";
    const toCur = t.toCurrency || fromCur;
    const amountLabel = fromCur === toCur ? formatCurrency(t.amount, fromCur) : `${formatCurrency(t.amount, fromCur)} → ${formatCurrency(t.toAmount != null ? t.toAmount : t.amount, toCur)}`;
    content = `
      <div class="tx-main">
        <span class="tx-cat" style="color:var(--ios-orange)"><span class="cat-icon" style="background:var(--ios-orange)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12h16M14 6l6 6-6 6M10 18l-6-6 6-6"/></svg></span>Trasferimento</span>
        <div class="tx-meta"><span>${formatShortDate(t.date)}</span><span>${esc(t.fromWallet)} → ${esc(t.toWallet)}</span>${t.note ? `<span>&bull; ${esc(t.note)}</span>` : ""}</div>
      </div>
      <div class="tx-actions">
        <span class="tx-amt amount-blur" style="color:var(--text-main)">${amountLabel}</span>
      </div>`;
  } else {
    const cur = txCurrency(t);
    content = `
      <div class="tx-main">
        <span class="tx-cat">${catBadge(t.category)}${esc(t.category)}</span>
        <div class="tx-meta"><span>${formatShortDate(t.date)}</span><span>&bull; ${esc(t.wallet)}</span>${t.frequency ? `<span class="tag">${FREQ_LABELS[t.frequency]}</span>` : ""}${t.auto ? `<span class="tag" title="Generato automaticamente">Auto</span>` : ""}${t.note ? `<span>&bull; ${esc(t.note)}</span>` : ""}</div>
      </div>
      <div class="tx-actions">
        <span class="tx-amt amount-blur ${t.type === "entrata" ? "pos" : "neg"}">${t.type === "entrata" ? "+" : "−"}${formatCurrency(t.amount, cur)}</span>
      </div>`;
  }

  return `
  <div class="tx-swipe-wrapper" style="animation-delay: ${delay}s;">
    <div class="tx-scroll-container">
      <div class="tx-main-content">${content}</div>
      <div class="tx-actions-swipe">
        <button type="button" class="btn-swipe-edit" data-edit="${t.id}" onclick="haptic('light')">✎</button>
        <button type="button" class="btn-swipe-del" data-del="${t.id}" onclick="haptic('heavy')">🗑</button>
      </div>
    </div>
  </div>`;
}

function drawCharts(incomeBreakdown, expenseBreakdown, trendData) {
  if (typeof Chart === 'undefined') return;
  
  if (incomeChart) { incomeChart.destroy(); incomeChart = null; }
  if (expenseChart) { expenseChart.destroy(); expenseChart = null; }
  if (trendChart) { trendChart.destroy(); trendChart = null; }
  
  const isDark = currentTheme === 'expert';
  const textColor = isDark ? '#A1A1AA' : '#6C6C70';
  const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.04)';

  const chartOptions = { 
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => formatCurrency(c.parsed) } } }, 
    cutout: "75%",
    animation: { duration: 1600, easing: 'easeInOutCubic', animateRotate: true, animateScale: true },
    transitions: { active: { animation: { duration: 400, easing: 'easeOutCubic' } } },
    elements: { arc: { borderWidth: isDark? 0:1, borderColor: isDark?'#000':'#FFF' } }
  };

  const incomeCanvas = document.getElementById("incomeCanvas");
  if (incomeCanvas && incomeBreakdown.length) {
    incomeChart = new Chart(incomeCanvas, { type: "doughnut", data: { labels: incomeBreakdown.map((e) => e.name), datasets: [{ data: incomeBreakdown.map((e) => e.value), backgroundColor: incomeBreakdown.map((e) => e.color), borderWidth: 0 }] }, options: chartOptions });
  }
  const expenseCanvas = document.getElementById("expenseCanvas");
  if (expenseCanvas && expenseBreakdown.length) {
    expenseChart = new Chart(expenseCanvas, { type: "doughnut", data: { labels: expenseBreakdown.map((e) => e.name), datasets: [{ data: expenseBreakdown.map((e) => e.value), backgroundColor: expenseBreakdown.map((e) => e.color), borderWidth: 0 }] }, options: chartOptions });
  }
  const trendCanvas = document.getElementById("trendCanvas");
  if (trendCanvas) {
    trendChart = new Chart(trendCanvas, { type: "line", data: { labels: trendData.map((d) => d.label), datasets: [
      { label: "Entrate", data: trendData.map((d) => d.entrate), borderColor: "#34C759", backgroundColor: "rgba(52, 199, 89, 0.1)", fill: true, tension: 0.4 },
      { label: "Uscite", data: trendData.map((d) => d.uscite), borderColor: "#FF3B30", backgroundColor: "rgba(255, 59, 48, 0.1)", fill: true, tension: 0.4 },
    ] }, options: { 
      animation: { duration: 1200, easing: 'easeOutQuart' }, 
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${formatCurrency(c.parsed.y)}` } } }, 
      scales: { 
        y: { ticks: { color: textColor, callback: (v) => new Intl.NumberFormat("it-IT").format(v) }, border: {display: false}, grid: {color: gridColor} }, 
        x: { ticks: { color: textColor }, border: {display: false}, grid: {display: false}} 
      } 
    } });
  }
}

function bindCurrencySeg(segId, prefixId) {
  const seg = document.getElementById(segId);
  if (!seg) return;
  seg.querySelectorAll("button").forEach((btn) => btn.onclick = () => {
    haptic('light');
    seg.dataset.value = btn.dataset.cur;
    seg.querySelectorAll("button").forEach((b) => b.classList.toggle("seg-active", b === btn));
    const prefixEl = document.getElementById(prefixId);
    if (prefixEl) prefixEl.textContent = CURRENCIES[btn.dataset.cur].symbol;
  });
}

function updateCurrencyUI() {
  if (currentSection !== "nuovo") return;
  const prefixEl = document.getElementById("txAmountPrefix");
  const amountInput = document.getElementById("txAmount");
  if (txType === "trasferimento") {
    const fromSel = document.getElementById("txFromWallet");
    const toSel = document.getElementById("txToWallet");
    if (!fromSel || !toSel) return;
    const fromCur = (walletByName(fromSel.value) || {}).currency || "EUR";
    const toCur = (walletByName(toSel.value) || {}).currency || "EUR";
    if (prefixEl) prefixEl.textContent = CURRENCIES[fromCur].symbol;
    const row = document.getElementById("txConvertRow");
    const preview = document.getElementById("txConvertPreview");
    if (!row || !preview) return;
    if (fromCur === toCur) { row.style.display = "none"; return; }
    row.style.display = "";
    const amt = Number(String(amountInput ? amountInput.value : "").replace(",", ".")) || 0;
    const converted = convert(amt, fromCur, toCur);
    const rate = convert(1, fromCur, toCur);
    preview.innerHTML = `${formatCurrency(amt, fromCur)} ≈ <b>${formatCurrency(converted, toCur)}</b><br><span style="font-size:12px; opacity:.65;">Tasso: 1 ${fromCur} = ${rate.toFixed(4)} ${toCur}</span>`;
  } else {
    const walSel = document.getElementById("txWallet");
    if (!walSel || !prefixEl) return;
    const cur = (walletByName(walSel.value) || {}).currency || "EUR";
    prefixEl.textContent = CURRENCIES[cur].symbol;
  }
}

function bindEvents() {
  txDeleteArmed = null;
  document.querySelectorAll(".tab-bar button").forEach((b) => b.onclick = () => { haptic('light'); currentSection = b.dataset.section; renderAll(); });
  document.querySelectorAll(".period-tabs button").forEach((b) => b.onclick = () => { haptic('light'); period = b.dataset.period; offset = 0; renderAll(); });
  const navPrev = document.getElementById("navPrev"); if (navPrev) navPrev.onclick = () => { haptic('light'); offset -= 1; renderAll(); };
  const navNext = document.getElementById("navNext"); if (navNext) navNext.onclick = () => { haptic('light'); offset += 1; renderAll(); };
  const navToday = document.getElementById("navToday"); if (navToday) navToday.onclick = () => { haptic('light'); offset = 0; renderAll(); };

  document.querySelectorAll(".wallet-stub").forEach((b) => b.onclick = () => {
    haptic('light');
    const id = b.dataset.wallet;
    walletFormOpen = false;
    activeWalletEdit = activeWalletEdit === id ? null : id;
    renderAll();
  });
  const btnAddWallet = document.getElementById("btnAddWallet"); if (btnAddWallet) btnAddWallet.onclick = () => { haptic('light'); activeWalletEdit = null; walletFormOpen = !walletFormOpen; renderAll(); };
  bindCurrencySeg("newWalletCurrencySeg", "newWalletCurrencyPrefix");
  bindCurrencySeg("editWalletCurrencySeg", "editWalletCurrencyPrefix");
  const addWalletBtn = document.getElementById("addWalletBtn");
  if (addWalletBtn) addWalletBtn.onclick = () => {
    const name = document.getElementById("newWalletName").value.trim();
    if (!name) return;
    const initialBalance = Number(document.getElementById("newWalletInitial").value) || 0;
    const curSeg = document.getElementById("newWalletCurrencySeg");
    const currency = curSeg ? curSeg.dataset.value : "EUR";
    walletFormOpen = false;
    haptic('success');
    persist({ ...data, wallets: [...data.wallets, { id: genId(), name, initialBalance, currency }] });
  };
  const cancelAddWallet = document.getElementById("cancelAddWallet"); if (cancelAddWallet) cancelAddWallet.onclick = () => { walletFormOpen = false; renderAll(); };
  const saveWalletEdit = document.getElementById("saveWalletEdit");
  if (saveWalletEdit) saveWalletEdit.onclick = () => {
    const w = data.wallets.find((x) => x.id === activeWalletEdit);
    const newName = document.getElementById("editWalletName").value.trim();
    if (!w || !newName) return;
    const newInitial = Number(document.getElementById("editWalletInitial").value) || 0;
    const curSeg = document.getElementById("editWalletCurrencySeg");
    const newCurrency = curSeg ? curSeg.dataset.value : (w.currency || "EUR");
    const wallets = data.wallets.map((x) => x.id === w.id ? { ...x, name: newName, initialBalance: newInitial, currency: newCurrency } : x);
    const transactions = newName !== w.name ? data.transactions.map((t) => {
      if (t.wallet === w.name) return { ...t, wallet: newName };
      if (t.type === "trasferimento") {
        let nt = t;
        if (nt.fromWallet === w.name) nt = { ...nt, fromWallet: newName };
        if (nt.toWallet === w.name) nt = { ...nt, toWallet: newName };
        return nt;
      }
      return t;
    }) : data.transactions;
    activeWalletEdit = null;
    haptic('success');
    persist({ ...data, wallets, transactions });
  };
  const closeWalletEdit = document.getElementById("closeWalletEdit"); if (closeWalletEdit) closeWalletEdit.onclick = () => { activeWalletEdit = null; renderAll(); };
  const deleteWalletBtn = document.getElementById("deleteWalletBtn");
  if (deleteWalletBtn) deleteWalletBtn.onclick = () => {
    haptic('heavy');
    if (walletDeleteArmed !== activeWalletEdit) { walletDeleteArmed = activeWalletEdit; renderAll(); setTimeout(() => { if (walletDeleteArmed === activeWalletEdit) { walletDeleteArmed = null; renderAll(); } }, 3000); return; }
    const wallets = data.wallets.filter((x) => x.id !== activeWalletEdit);
    activeWalletEdit = null; walletDeleteArmed = null;
    persist({ ...data, wallets });
  };

  document.querySelectorAll(".type-segmented button").forEach((b) => {
    if(!b.hasAttribute('onclick')) { b.onclick = () => { haptic('light'); txType = b.dataset.type; renderAll(); }; }
  });

  const txCategorySel = document.getElementById("txCategory");
  if (txCategorySel) txCategorySel.onchange = (e) => {
    const badgeContainer = document.getElementById("txCategoryIconBadge");
    if (badgeContainer) { badgeContainer.innerHTML = catBadge(e.target.value); }
  };
  
  function bindWalletDot(selId, dotId) {
    const sel = document.getElementById(selId);
    if (!sel) return;
    sel.onchange = (e) => {
      const idx = data.wallets.findIndex((w) => w.name === e.target.value);
      const dot = document.getElementById(dotId);
      if (dot) dot.style.background = idx >= 0 ? PALETTE[idx % PALETTE.length] : "var(--separator)";
      updateCurrencyUI();
    };
  }
  bindWalletDot("txWallet", "txWalletDot");
  bindWalletDot("txFromWallet", "txFromWalletDot");
  bindWalletDot("txToWallet", "txToWalletDot");
  const txAmountInput = document.getElementById("txAmount");
  if (txAmountInput) txAmountInput.oninput = () => updateCurrencyUI();

  function showFormError(msg) { haptic('heavy'); const el = document.getElementById("txFormError"); if (el) { el.textContent = msg; el.style.display = "block"; } }
  function hideFormError() { const el = document.getElementById("txFormError"); if (el) el.style.display = "none"; }

  const txForm = document.getElementById("txForm");
  if (txForm) txForm.onsubmit = (e) => {
    e.preventDefault(); hideFormError();
    const amount = Math.round(Number(String(document.getElementById("txAmount").value).replace(",", ".")) * 100) / 100;
    const dateVal = document.getElementById("txDate").value;
    const note = document.getElementById("txNote").value;
    if (!amount || isNaN(amount) || amount <= 0) { showFormError("Inserisci un importo valido maggiore di zero."); return; }
    let payload;
    if (txType === "trasferimento") {
      const fromWallet = document.getElementById("txFromWallet").value;
      const toWallet = document.getElementById("txToWallet").value;
      if (!fromWallet || !toWallet) return;
      if (fromWallet === toWallet) { showFormError("Scegli due conti diversi."); return; }
      const fromCurrency = (walletByName(fromWallet) || {}).currency || "EUR";
      const toCurrency = (walletByName(toWallet) || {}).currency || "EUR";
      const toAmount = fromCurrency === toCurrency ? amount : Math.round(convert(amount, fromCurrency, toCurrency) * 100) / 100;
      payload = { type: "trasferimento", amount, toAmount, fromCurrency, toCurrency, fromWallet, toWallet, date: dateVal, note };
    } else {
      const category = document.getElementById("txCategory").value;
      const wallet = document.getElementById("txWallet").value;
      const frequency = txType === "uscita" ? document.getElementById("txFrequency").value : null;
      if (!category || !wallet) return;
      const currency = (walletByName(wallet) || {}).currency || "EUR";
      const existingTx = editingId ? data.transactions.find((t) => t.id === editingId) : null;
      const seriesId = frequency === "fissa" ? ((existingTx && existingTx.seriesId) || genId()) : undefined;
      payload = { type: txType, amount, category, wallet, currency, frequency, seriesId, date: dateVal, note };
    }
    let transactions;
    if (editingId) { transactions = data.transactions.map((t) => t.id === editingId ? { id: t.id, ...payload } : t); editingId = null; }
    else { transactions = [...data.transactions, { id: genId(), ...payload }]; }
    haptic('success');
    persist({ ...data, transactions });
    
    document.getElementById("txForm").reset();
    currentSection = "home";
    renderAll();
    flashHero();
  };
  const txCancelEdit = document.getElementById("txCancelEdit"); if (txCancelEdit) txCancelEdit.onclick = () => { editingId = null; renderAll(); };
  const btnStopSeries = document.getElementById("btnStopSeries");
  if (btnStopSeries) btnStopSeries.onclick = () => {
    haptic('heavy');
    const et = data.transactions.find((t) => t.id === editingId);
    if (!et || !et.seriesId) return;
    if (seriesStopArmed !== editingId) { seriesStopArmed = editingId; renderAll(); setTimeout(() => { if (seriesStopArmed === editingId) { seriesStopArmed = null; renderAll(); } }, 3000); return; }
    seriesStopArmed = null;
    const stoppedSeriesIds = [...(data.stoppedSeriesIds || []), et.seriesId];
    persist({ ...data, stoppedSeriesIds });
    showImportMessage("ok", "Serie interrotta: non verranno generati altri movimenti fissi futuri per questa spesa.");
  };

  document.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => {
    const t = data.transactions.find((x) => x.id === b.dataset.edit);
    if (!t) return;
    editingId = t.id; txType = t.type; currentSection = "nuovo"; renderAll();
    document.getElementById("txAmount").value = t.amount;
    document.getElementById("txDate").value = t.date;
    document.getElementById("txNote").value = t.note || "";
    if (t.type === "trasferimento") {
      document.getElementById("txFromWallet").value = t.fromWallet; document.getElementById("txToWallet").value = t.toWallet;
      document.getElementById("txFromWallet").dispatchEvent(new Event('change')); document.getElementById("txToWallet").dispatchEvent(new Event('change'));
    } else {
      document.getElementById("txCategory").value = t.category; document.getElementById("txWallet").value = t.wallet;
      if (t.frequency) document.getElementById("txFrequency").value = t.frequency;
      document.getElementById("txCategory").dispatchEvent(new Event('change')); document.getElementById("txWallet").dispatchEvent(new Event('change'));
    }
  });
  
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
    const id = b.dataset.del;
    haptic('heavy');
    if (txDeleteArmed !== id) {
      // arma senza un renderAll() completo: un re-render azzererebbe lo scroll dello
      // swipe e richiuderebbe subito il pulsante appena rivelato dall'utente
      txDeleteArmed = id;
      b.textContent = "✓";
      b.classList.add("armed");
      clearTimeout(b._armTimer);
      b._armTimer = setTimeout(() => { if (txDeleteArmed === id) { txDeleteArmed = null; b.textContent = "🗑"; b.classList.remove("armed"); } }, 3000);
      return;
    }
    txDeleteArmed = null;
    persist({ ...data, transactions: data.transactions.filter((t) => t.id !== id) });
  });

  const filterWalletSel = document.getElementById("filterWalletSel"); if (filterWalletSel) filterWalletSel.onchange = (e) => { filterWallet = e.target.value; renderAll(); };
  const filterCategorySel = document.getElementById("filterCategorySel"); if (filterCategorySel) filterCategorySel.onchange = (e) => { filterCategory = e.target.value; renderAll(); };
  const filterSearchInput = document.getElementById("filterSearchInput");
  if (filterSearchInput) filterSearchInput.oninput = (e) => {
    filterSearch = e.target.value;
    renderAll();
    // renderAll() ricostruisce il DOM: recupera il nuovo input e ridai il focus con
    // il cursore in fondo, altrimenti ad ogni carattere digitato si perderebbe il focus
    const el = document.getElementById("filterSearchInput");
    if (el) { el.focus(); const v = el.value; el.setSelectionRange(v.length, v.length); }
  };

  const btnToggleCategories = document.getElementById("btnToggleCategories"); if (btnToggleCategories) btnToggleCategories.onclick = () => { categoriesOpen = !categoriesOpen; renderAll(); };
  document.querySelectorAll("[data-rmcat]").forEach((b) => b.onclick = () => {
    const [type, name] = b.dataset.rmcat.split("|");
    persist({ ...data, categories: { ...data.categories, [type]: data.categories[type].filter((c) => c !== name) } });
  });
  
  const addCatEntrata = document.getElementById("addCatEntrata");
  if (addCatEntrata) addCatEntrata.onclick = () => {
    const val = document.getElementById("newCatEntrata").value.trim();
    if (!val || data.categories.entrata.includes(val)) return;
    persist({ ...data, categories: { ...data.categories, entrata: [...data.categories.entrata, val] } });
  };
  const addCatUscita = document.getElementById("addCatUscita");
  if (addCatUscita) addCatUscita.onclick = () => {
    const val = document.getElementById("newCatUscita").value.trim();
    if (!val || data.categories.uscita.includes(val)) return;
    persist({ ...data, categories: { ...data.categories, uscita: [...data.categories.uscita, val] } });
  };

  const btnExportCsv = document.getElementById("btnExportCsv"); if (btnExportCsv) btnExportCsv.onclick = exportCSV;
  const btnBackup = document.getElementById("btnBackup"); if (btnBackup) btnBackup.onclick = downloadBackup;
  const btnRestore = document.getElementById("btnRestore"); if (btnRestore) btnRestore.onclick = () => document.getElementById("restoreInput").click();

  const btnReset = document.getElementById("btnReset");
  if (btnReset) btnReset.onclick = () => {
    haptic('heavy');
    if (!resetArmed) { resetArmed = true; renderAll(); setTimeout(() => { resetArmed = false; renderAll(); }, 3000); return; }
    resetArmed = false;
    persist({ wallets: [], categories: { ...DEFAULT_CATEGORIES }, transactions: [] });
  };

  const btnToggleLock = document.getElementById("btnToggleLock");
  if (btnToggleLock) btnToggleLock.onclick = () => {
    haptic('light');
    if (lockEnabled) { lockDisableOpen = true; lockSetupOpen = false; lockDisableError = null; }
    else if (webauthnAvailable) { lockSetupOpen = true; lockDisableOpen = false; lockSetupError = null; }
    renderAll();
  };
  const lockSetupCancel = document.getElementById("lockSetupCancel"); if (lockSetupCancel) lockSetupCancel.onclick = () => { lockSetupOpen = false; lockSetupError = null; renderAll(); };
  const lockSetupConfirm = document.getElementById("lockSetupConfirm");
  if (lockSetupConfirm) lockSetupConfirm.onclick = async () => {
    const p1 = document.getElementById("lockSetupPass1").value;
    const p2 = document.getElementById("lockSetupPass2").value;
    if (!p1 || p1.length < 4) { lockSetupError = "La password deve avere almeno 4 caratteri."; renderAll(); return; }
    if (p1 !== p2) { lockSetupError = "Le password non coincidono."; renderAll(); return; }
    lockSetupError = null;
    const ok = await registerFaceId();
    if (!ok) { lockSetupError = "Impossibile registrare Face ID. Riprova."; renderAll(); return; }
    const salt = genSaltHex();
    const hash = await hashPassword(p1, salt);
    lockPassSalt = salt; lockPassHash = hash; lockEnabled = true; lockHashAlgo = "pbkdf2";
    localStorage.setItem('registro-lock-pass-salt', salt);
    localStorage.setItem('registro-lock-pass-hash', hash);
    localStorage.setItem('registro-lock-hash-algo', 'pbkdf2');
    localStorage.setItem('registro-lock-enabled', 'true');
    lockSetupOpen = false;
    haptic('success');
    renderAll();
  };
  const lockDisableCancel = document.getElementById("lockDisableCancel"); if (lockDisableCancel) lockDisableCancel.onclick = () => { lockDisableOpen = false; lockDisableError = null; renderAll(); };
  const lockDisableConfirm = document.getElementById("lockDisableConfirm");
  if (lockDisableConfirm) lockDisableConfirm.onclick = async () => {
    const pw = document.getElementById("lockDisablePass").value;
    const ok = await verifyLockPassword(pw);
    if (!ok) { lockDisableError = "Password errata."; haptic('heavy'); renderAll(); return; }
    lockEnabled = false; lockCredId = null; lockPassHash = null; lockPassSalt = null; lockHashAlgo = "legacy"; lockDisableOpen = false;
    localStorage.removeItem('registro-lock-enabled'); localStorage.removeItem('registro-lock-cred-id');
    localStorage.removeItem('registro-lock-pass-hash'); localStorage.removeItem('registro-lock-pass-salt');
    localStorage.removeItem('registro-lock-hash-algo');
    haptic('success');
    renderAll();
  };

  const btnOpenSignup = document.getElementById("btnOpenSignup"); if (btnOpenSignup) btnOpenSignup.onclick = () => { haptic('light'); accountFormOpen = "signup"; accountError = null; accountDraft = { email: "", pass1: "", pass2: "" }; renderAll(); };
  const btnOpenSignin = document.getElementById("btnOpenSignin"); if (btnOpenSignin) btnOpenSignin.onclick = () => { haptic('light'); accountFormOpen = "signin"; accountError = null; accountDraft = { email: "", pass1: "", pass2: "" }; renderAll(); };
  const accountFormCancel = document.getElementById("accountFormCancel"); if (accountFormCancel) accountFormCancel.onclick = () => { accountFormOpen = null; accountError = null; renderAll(); };
  const accountEmailInput = document.getElementById("accountEmail"); if (accountEmailInput) accountEmailInput.oninput = (e) => { accountDraft.email = e.target.value; };
  const accountPass1Input = document.getElementById("accountPass1"); if (accountPass1Input) accountPass1Input.oninput = (e) => { accountDraft.pass1 = e.target.value; };
  const accountPass2Input = document.getElementById("accountPass2"); if (accountPass2Input) accountPass2Input.oninput = (e) => { accountDraft.pass2 = e.target.value; };

  const accountSignupConfirm = document.getElementById("accountSignupConfirm");
  if (accountSignupConfirm) accountSignupConfirm.onclick = async () => {
    const email = document.getElementById("accountEmail").value.trim();
    const p1 = document.getElementById("accountPass1").value;
    const p2 = document.getElementById("accountPass2").value;
    if (!email || !email.includes("@")) { accountError = "Inserisci un'email valida."; renderAll(); return; }
    if (!p1 || p1.length < 6) { accountError = "La password deve avere almeno 6 caratteri."; renderAll(); return; }
    if (p1 !== p2) { accountError = "Le password non coincidono."; renderAll(); return; }
    if (!authInstance || !authFns || !authInstance.currentUser) { accountError = "Servizio cloud non disponibile."; renderAll(); return; }
    accountBusy = true; accountError = null; renderAll();
    try {
      const cred = authFns.EmailAuthProvider.credential(email, p1);
      await authFns.linkWithCredential(authInstance.currentUser, cred);
      accountFormOpen = null;
      haptic('success');
      showImportMessage("ok", "Account creato: i tuoi dati sono ora collegati a questo indirizzo email.");
    } catch (e) {
      if (e && e.code === "auth/email-already-in-use") accountError = "Questa email ha già un account: usa \"Accedi a un account esistente\".";
      else if (e && e.code === "auth/operation-not-allowed") accountError = "Login con Email non abilitato su Firebase: vai in Console Firebase → Authentication → Sign-in method e attivalo.";
      else if (e && e.code === "auth/weak-password") accountError = "Password troppo debole (minimo 6 caratteri).";
      else accountError = "Impossibile creare l'account. Riprova.";
    }
    accountBusy = false; renderAll();
  };

  const accountSigninConfirm = document.getElementById("accountSigninConfirm");
  if (accountSigninConfirm) accountSigninConfirm.onclick = async () => {
    const email = document.getElementById("accountEmail").value.trim();
    const p1 = document.getElementById("accountPass1").value;
    if (!email || !p1) { accountError = "Inserisci email e password."; renderAll(); return; }
    if (!authInstance || !authFns) { accountError = "Servizio cloud non disponibile."; renderAll(); return; }
    accountBusy = true; accountError = null; renderAll();
    try {
      await authFns.signInWithEmailAndPassword(authInstance, email, p1);
      accountFormOpen = null;
      haptic('success');
      showImportMessage("ok", "Accesso effettuato.");
    } catch (e) {
      if (e && e.code === "auth/operation-not-allowed") accountError = "Login con Email non abilitato su Firebase: vai in Console Firebase → Authentication → Sign-in method e attivalo.";
      else accountError = "Email o password errati.";
    }
    accountBusy = false; renderAll();
  };

  const btnSignOut = document.getElementById("btnSignOut");
  if (btnSignOut) btnSignOut.onclick = async () => {
    if (!authInstance || !authFns) return;
    haptic('light');
    try {
      data = { wallets: [], categories: { ...DEFAULT_CATEGORIES }, transactions: [] };
      saveLocal();
      await authFns.signOut(authInstance);
      await authFns.signInAnonymously(authInstance);
    } catch (e) { console.error("Sign-out failed", e); }
    renderAll();
  };
}

function flashHero() {
  const el = document.getElementById("heroBalance");
  if (!el) return;
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 500);
}

function csvField(v) {
  const s = String(v == null ? "" : v);
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCSV() {
  const header = ["Data", "Tipo", "Categoria", "Portafoglio", "Frequenza", "Importo", "Valuta", "Nota"];
  const rows = data.transactions.slice().sort((a, b) => a.date.localeCompare(b.date)).map((t) => {
    let cat = t.type === 'trasferimento' ? 'Trasferimento' : (t.category || '');
    let wal = t.type === 'trasferimento' ? `${t.fromWallet} -> ${t.toWallet}` : (t.wallet || '');
    let cur = t.type === 'trasferimento' ? `${t.fromCurrency || "EUR"}${t.toCurrency && t.toCurrency !== t.fromCurrency ? " -> " + t.toCurrency : ""}` : txCurrency(t);
    return [t.date, t.type, cat, wal, t.frequency || "", t.amount.toFixed(2).replace(".", ","), cur, t.note || ""].map(csvField);
  });
  const csv = [header.map(csvField), ...rows].map((r) => r.join(";")).join("\r\n");
  downloadBlob(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" }), "registro.csv");
}
function downloadBackup() { downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }), "registro-backup.json"); }
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
document.getElementById("restoreInput").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0]; e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      if (!parsed || !Array.isArray(parsed.wallets) || !Array.isArray(parsed.transactions) || !parsed.categories) throw new Error("invalido");
      persist(parsed); showImportMessage("ok", "Ripristinato con successo.");
    } catch (err) {
      showImportMessage("error", "File non valido.");
    }
  };
  reader.readAsText(file);
});

renderAll();
initFirebase();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => console.error(e));
  });
}
</script>
</body>
</html>
