.app-section { display:none; }
.app-section.active { display:block; animation:fadeIn 0.18s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

.tab-bar { position:fixed; left:0; right:0; bottom:0; background:var(--ink); display:flex; justify-content:space-around;
  padding:9px 4px calc(9px + env(safe-area-inset-bottom)); box-shadow:0 -2px 0 var(--gold-deep); z-index:20; }

.tab-bar button svg { width:22px; height:22px; }
.tab-bar button.tab-active { color:var(--gold); }
</style>

let idCounter = 0;
function genId() { idCounter += 1; return `id-${Date.now().toString(36)}-${idCounter}-${Math.random().toString(36).slice(2, 7)}`; }
function pad(n) { return n.toString().padStart(2, "0"); }
function toISODate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseISODate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function startOfDay(d) { const nd = new Date(d); nd.setHours(0, 0, 0, 0); return nd; }
function startOfWeek(d) { const nd = startOfDay(d); const day = nd.getDay(); const diff = (day === 0 ? -6 : 1) - day; nd.setDate(nd.getDate() + diff); return nd; }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function startOfYear(d) { return new Date(d.getFullYear(), 0, 1); }
function addPeriod(d, period, amount) {
  const nd = new Date(d);
  if (period === "day") nd.setDate(nd.getDate() + amount);
  else if (period === "week") nd.setDate(nd.getDate() + 7 * amount);
  else if (period === "month") nd.setMonth(nd.getMonth() + amount);
  else if (period === "year") nd.setFullYear(nd.getFullYear() + amount);
  return nd;
}
function getPeriodStart(period, ref) { if (period === "day") return startOfDay(ref); if (period === "week") return startOfWeek(ref); if (period === "month") return startOfMonth(ref); return startOfYear(ref); }
function getPeriodRange(period, offset) { const today = new Date(); const ref = addPeriod(today, period, offset); const start = getPeriodStart(period, ref); const end = addPeriod(start, period, 1); return { start, end }; }
function formatPeriodLabel(period, start) {
  if (period === "day") return new Intl.DateTimeFormat("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(start);
  if (period === "week") { const end = new Date(start); end.setDate(end.getDate() + 6); const fmt = new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "short" }); return `${fmt.format(start)} – ${fmt.format(end)}`; }
  if (period === "month") return new Intl.DateTimeFormat("it-IT", { month: "long", year: "numeric" }).format(start);
  return new Intl.DateTimeFormat("it-IT", { year: "numeric" }).format(start);
}
function formatPeriodShortLabel(period, start) {
  if (period === "month") return new Intl.DateTimeFormat("it-IT", { month: "short" }).format(start);
  if (period === "year") return new Intl.DateTimeFormat("it-IT", { year: "numeric" }).format(start);
  return new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "short" }).format(start);
}
function formatCurrency(v) { return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(v || 0); }
function formatShortDate(iso) { return new Intl.DateTimeFormat("it-IT", { day: "2-digit", month: "short" }).format(parseISODate(iso)); }
function buildBreakdown(list) {
  const map = {};
  list.forEach((t) => { map[t.category] = (map[t.category] || 0) + t.amount; });
  return Object.entries(map).map(([name, value]) => ({ name, value, color: colorForName(name) })).sort((a, b) => b.value - a.value);
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) {} }

let fsDoc = null, fsSetDoc = null;

async function persist(next) {
  data = next;
  saveLocal();
  renderAll();
  if (cloudReady && cloudUser && db && fsSetDoc) {
    fsSetDoc(fsDoc(db, "registro", cloudUser.uid), data).catch(() => setSync("error"));
  }
}

function setSync(state) {
  const el = document.getElementById("syncDot");
  const label = document.getElementById("syncLabel");
  if (!el) return;
  el.className = "sync-dot" + (state === "ok" ? " ok" : state === "pending" ? " pending" : state === "error" ? " error" : "");
  if (label) label.textContent = state === "ok" ? "Sincronizzato" : state === "pending" ? "Offline — verrà sincronizzato alla riconnessione" : state === "error" ? "Errore di sincronizzazione" : cloudReady ? "In attesa..." : "Solo su questo dispositivo";
}

async function initFirebase() {
  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.includes("INSERISCI")) return;
  try {
    const [{ initializeApp }, authMod, fsMod] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js"),
    ]);
    const { getAuth, signInAnonymously, onAuthStateChanged } = authMod;
    const { initializeFirestore, persistentLocalCache, persistentSingleTabManager, doc, setDoc, onSnapshot } = fsMod;
    fsDoc = doc; fsSetDoc = setDoc;
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) });
    onAuthStateChanged(auth, (user) => {
      if (!user) return;
      cloudUser = user;
      cloudReady = true;
      onSnapshot(doc(db, "registro", user.uid), { includeMetadataChanges: true }, (snap) => {
        if (snap.exists()) {
          data = snap.data();
          saveLocal();
        } else if (!snap.metadata.fromCache) {
          setDoc(doc(db, "registro", user.uid), data);
        }
        setSync(snap.metadata.hasPendingWrites || snap.metadata.fromCache ? "pending" : "ok");
        renderAll();
      }, () => setSync("error"));
    });
    await signInAnonymously(auth);
  } catch (e) {
    console.error("Firebase init failed", e);

  }
}

/* ---------------- derived data ---------------- */
function walletBalance(w) {
  return walletBalanceExcluding(w, null);
}
function walletBalanceExcluding(w, excludeId) {
  const sum = data.transactions.reduce((acc, t) => {
    if (t.id === excludeId) return acc;
    if (t.type === "trasferimento") {
      if (t.fromWallet === w.name) return acc - t.amount;
      if (t.toWallet === w.name) return acc + t.amount;
      return acc;
    }
    return t.wallet === w.name ? acc + (t.type === "entrata" ? t.amount : -t.amount) : acc;
  }, 0);
  return (w.initialBalance || 0) + sum;
}

    </div>
    <span class="tx-amt ${t.type === "entrata" ? "pos" : "neg"}">${t.type === "entrata" ? "+" : "−"}${formatCurrency(t.amount)}</span>
    <span class="tx-meta-actions"><button type="button" data-edit="${t.id}" aria-label="Modifica">✎</button><button type="button" data-del="${t.id}" aria-label="Elimina">✕</button></span>
  </div>`;
}

function renderWalletPanel() {
  if (activeWalletEdit) {
    const w = data.wallets.find((x) => x.id === activeWalletEdit);
    if (w) return `<div class="wallet-edit-panel">
      <label>Nome<input type="text" id="editWalletName" value="${esc(w.name)}"></label>
      <label>Saldo iniziale<input type="number" step="0.01" id="editWalletInitial" value="${w.initialBalance || 0}"></label>
      <div class="wallet-edit-actions">
        <button type="button" class="btn-small" id="saveWalletEdit">Salva</button>
        <button type="button" class="btn-small btn-danger" id="deleteWalletBtn">${walletDeleteArmed === w.id ? "Conferma" : "Elimina"}</button>
        <button type="button" class="btn-small btn-ghost" id="closeWalletEdit">Chiudi</button>
      </div></div>`;
  }
  if (walletFormOpen) {
    return `<div class="wallet-edit-panel">
      <label>Nome<input type="text" id="newWalletName" placeholder="es. Contanti"></label>
      <label>Saldo iniziale<input type="number" step="0.01" id="newWalletInitial" placeholder="0"></label>
      <div class="wallet-edit-actions">
        <button type="button" class="btn-small" id="addWalletBtn">Aggiungi</button>
        <button type="button" class="btn-small btn-ghost" id="cancelAddWallet">Annulla</button>
      </div></div>`;
  }
  return "";
}

function renderBreakdown(heading, list, frameColor, key) {
  if (!list.length) return `<div class="breakdown-block"><h3 class="breakdown-heading">${heading}</h3><p class="empty-mini">Nessun movimento in questo periodo.</p></div>`;
  return `<div class="breakdown-block"><h3 class="breakdown-heading">${heading}</h3>
    <div class="coin-frame" style="--fc:${frameColor}"><canvas id="${key}Canvas"></canvas></div>
    ${list.map((e) => `<div class="leader-row" style="border-left-color:${e.color}"><span class="leader-name">${catBadge(e.name)}${esc(e.name)}</span><span class="leader-value">${formatCurrency(e.value)}</span></div>`).join("")}
  </div>`;
}

function drawCharts(incomeBreakdown, expenseBreakdown, trendData) {
  if (incomeChart) { incomeChart.destroy(); incomeChart = null; }
  if (expenseChart) { expenseChart.destroy(); expenseChart = null; }
  if (trendChart) { trendChart.destroy(); trendChart = null; }
  const incomeCanvas = document.getElementById("incomeCanvas");
  if (incomeCanvas && incomeBreakdown.length) {
    incomeChart = new Chart(incomeCanvas, { type: "doughnut", data: { labels: incomeBreakdown.map((e) => e.name), datasets: [{ data: incomeBreakdown.map((e) => e.value), backgroundColor: incomeBreakdown.map((e) => e.color), borderWidth: 0 }] }, options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => formatCurrency(c.parsed) } } }, cutout: "55%" } });
  }
  const expenseCanvas = document.getElementById("expenseCanvas");
  if (expenseCanvas && expenseBreakdown.length) {
    expenseChart = new Chart(expenseCanvas, { type: "doughnut", data: { labels: expenseBreakdown.map((e) => e.name), datasets: [{ data: expenseBreakdown.map((e) => e.value), backgroundColor: expenseBreakdown.map((e) => e.color), borderWidth: 0 }] }, options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => formatCurrency(c.parsed) } } }, cutout: "55%" } });
  }
  const trendCanvas = document.getElementById("trendCanvas");
  if (trendCanvas) {
    trendChart = new Chart(trendCanvas, { type: "bar", data: { labels: trendData.map((d) => d.label), datasets: [
      { label: "Entrate", data: trendData.map((d) => d.entrate), backgroundColor: "#F2B705" },
      { label: "Uscite", data: trendData.map((d) => d.uscite), backgroundColor: "#E8543E" },
    ] }, options: { plugins: { tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${formatCurrency(c.parsed.y)}` } } }, scales: { y: { ticks: { callback: (v) => new Intl.NumberFormat("it-IT").format(v) } } } } });
  }
}

/* ---------------- events ---------------- */
function bindEvents() {
  document.querySelectorAll(".tab-bar button").forEach((b) => b.onclick = () => { currentSection = b.dataset.section; renderAll(); });
  document.querySelectorAll(".period-tabs button").forEach((b) => b.onclick = () => { period = b.dataset.period; offset = 0; renderAll(); });
  const navPrev = document.getElementById("navPrev"); if (navPrev) navPrev.onclick = () => { offset -= 1; renderAll(); };
  const navNext = document.getElementById("navNext"); if (navNext) navNext.onclick = () => { offset += 1; renderAll(); };
  const navToday = document.getElementById("navToday"); if (navToday) navToday.onclick = () => { offset = 0; renderAll(); };

  document.querySelectorAll(".wallet-stub").forEach((b) => b.onclick = () => {
    const id = b.dataset.wallet;
    walletFormOpen = false;
    activeWalletEdit = activeWalletEdit === id ? null : id;
    renderAll();
  });
  const btnAddWallet = document.getElementById("btnAddWallet"); if (btnAddWallet) btnAddWallet.onclick = () => { activeWalletEdit = null; walletFormOpen = !walletFormOpen; renderAll(); };
  const addWalletBtn = document.getElementById("addWalletBtn");
  if (addWalletBtn) addWalletBtn.onclick = () => {
    const name = document.getElementById("newWalletName").value.trim();
    if (!name) return;
    const initialBalance = Number(document.getElementById("newWalletInitial").value) || 0;
    walletFormOpen = false;
    persist({ ...data, wallets: [...data.wallets, { id: genId(), name, initialBalance }] });
  };
  const cancelAddWallet = document.getElementById("cancelAddWallet"); if (cancelAddWallet) cancelAddWallet.onclick = () => { walletFormOpen = false; renderAll(); };
  const saveWalletEdit = document.getElementById("saveWalletEdit");
  if (saveWalletEdit) saveWalletEdit.onclick = () => {
    const w = data.wallets.find((x) => x.id === activeWalletEdit);
    const newName = document.getElementById("editWalletName").value.trim();
    if (!w || !newName) return;
    const newInitial = Number(document.getElementById("editWalletInitial").value) || 0;
    const wallets = data.wallets.map((x) => x.id === w.id ? { ...x, name: newName, initialBalance: newInitial } : x);
    const transactions = newName !== w.name ? data.transactions.map((t) => {
      if (t.wallet === w.name) return { ...t, wallet: newName };
      if (t.type === "trasferimento") {
        let nt = t;
        if (nt.fromWallet === w.name) nt = { ...nt, fromWallet: newName };
        if (nt.toWallet === w.name) nt = { ...nt, toWallet: newName };
        return nt;
      }
      return t;
    }) : data.transactions;
    activeWalletEdit = null;
    persist({ ...data, wallets, transactions });
  };
  const closeWalletEdit = document.getElementById("closeWalletEdit"); if (closeWalletEdit) closeWalletEdit.onclick = () => { activeWalletEdit = null; renderAll(); };
  const deleteWalletBtn = document.getElementById("deleteWalletBtn");
  if (deleteWalletBtn) deleteWalletBtn.onclick = () => {
    if (walletDeleteArmed !== activeWalletEdit) { walletDeleteArmed = activeWalletEdit; renderAll(); setTimeout(() => { if (walletDeleteArmed === activeWalletEdit) { walletDeleteArmed = null; renderAll(); } }, 3000); return; }
    const wallets = data.wallets.filter((x) => x.id !== activeWalletEdit);
    activeWalletEdit = null; walletDeleteArmed = null;
    persist({ ...data, wallets });
  };

  document.querySelectorAll(".segmented button").forEach((b) => b.onclick = () => { txType = b.dataset.type; renderAll(); });

  const txCategorySel = document.getElementById("txCategory");
  if (txCategorySel) txCategorySel.onchange = (e) => {
    const badge = document.getElementById("txCategoryIconBadge");
    if (badge) { badge.style.background = colorForName(e.target.value); badge.innerHTML = categoryIcon(e.target.value); }
  };
  function bindWalletDot(selId, dotId) {
    const sel = document.getElementById(selId);
    if (!sel) return;
    sel.onchange = (e) => {
      const idx = data.wallets.findIndex((w) => w.name === e.target.value);
      const dot = document.getElementById(dotId);
      if (dot) dot.style.background = idx >= 0 ? WALLET_COLORS[idx % WALLET_COLORS.length] : "var(--rule)";
    };
  }
  bindWalletDot("txWallet", "txWalletDot");
  bindWalletDot("txFromWallet", "txFromWalletDot");
  bindWalletDot("txToWallet", "txToWalletDot");

  function showFormError(msg) {
    const el = document.getElementById("txFormError");
    if (el) { el.textContent = msg; el.style.display = "block"; }
  }
  function hideFormError() {
    const el = document.getElementById("txFormError");
    if (el) el.style.display = "none";
  }

  const txForm = document.getElementById("txForm");
  if (txForm) txForm.onsubmit = (e) => {
    e.preventDefault();
    hideFormError();
    const amount = Math.round(Number(String(document.getElementById("txAmount").value).replace(",", ".")) * 100) / 100;
    const dateVal = document.getElementById("txDate").value;
    const note = document.getElementById("txNote").value;
    if (!amount || amount <= 0) return;
    let payload;
    if (txType === "trasferimento") {
      const fromWallet = document.getElementById("txFromWallet").value;
      const toWallet = document.getElementById("txToWallet").value;
      if (!fromWallet || !toWallet) return;
      if (fromWallet === toWallet) { showFormError("Scegli due portafogli diversi per il trasferimento."); return; }
      const fromObj = data.wallets.find((w) => w.name === fromWallet);
      const available = walletBalanceExcluding(fromObj, editingId);
      if (amount > available) {
        showFormError(`Il portafoglio "${fromWallet}" ha solo ${formatCurrency(available)} disponibili — non puoi trasferire ${formatCurrency(amount)}.`);
        return;
      }
      payload = { type: "trasferimento", amount, fromWallet, toWallet, date: dateVal, note };
    } else {
      const category = document.getElementById("txCategory").value;
      const wallet = document.getElementById("txWallet").value;
      const frequency = txType === "uscita" ? document.getElementById("txFrequency").value : null;
      if (!category || !wallet) return;
      if (txType === "uscita") {
        const walletObj = data.wallets.find((w) => w.name === wallet);
        const available = walletBalanceExcluding(walletObj, editingId);
        if (amount > available) {
          showFormError(`Il portafoglio "${wallet}" ha solo ${formatCurrency(available)} disponibili — non puoi registrare una spesa di ${formatCurrency(amount)}.`);
          return;
        }
      }
      payload = { type: txType, amount, category, wallet, frequency, date: dateVal, note };
    }
    let transactions;
    if (editingId) { transactions = data.transactions.map((t) => t.id === editingId ? { id: t.id, ...payload } : t); editingId = null; }
    else { transactions = [...data.transactions, { id: genId(), ...payload }]; }
    persist({ ...data, transactions });
    flashHero();
  };
  const txCancelEdit = document.getElementById("txCancelEdit"); if (txCancelEdit) txCancelEdit.onclick = () => { editingId = null; renderAll(); };

  document.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => {
    const t = data.transactions.find((x) => x.id === b.dataset.edit);
    if (!t) return;
    editingId = t.id; txType = t.type; currentSection = "nuovo";
    renderAll();
    document.getElementById("txAmount").value = t.amount;
    document.getElementById("txDate").value = t.date;
    document.getElementById("txNote").value = t.note || "";
    if (t.type === "trasferimento") {
      document.getElementById("txFromWallet").value = t.fromWallet;
      document.getElementById("txToWallet").value = t.toWallet;
      document.getElementById("txFromWallet").onchange({ target: { value: t.fromWallet } });
      document.getElementById("txToWallet").onchange({ target: { value: t.toWallet } });
    } else {
      document.getElementById("txCategory").value = t.category;
      document.getElementById("txWallet").value = t.wallet;
      if (t.frequency) document.getElementById("txFrequency").value = t.frequency;
      document.getElementById("txCategory").onchange({ target: { value: t.category } });
      document.getElementById("txWallet").onchange({ target: { value: t.wallet } });
    }
  });
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => persist({ ...data, transactions: data.transactions.filter((t) => t.id !== b.dataset.del) }));

  const filterWalletSel = document.getElementById("filterWalletSel"); if (filterWalletSel) filterWalletSel.onchange = (e) => { filterWallet = e.target.value; renderAll(); };
  const filterCategorySel = document.getElementById("filterCategorySel"); if (filterCategorySel) filterCategorySel.onchange = (e) => { filterCategory = e.target.value; renderAll(); };
  const filterFrequencySel = document.getElementById("filterFrequencySel"); if (filterFrequencySel) filterFrequencySel.onchange = (e) => { filterFrequency = e.target.value; renderAll(); };

  const btnToggleCategories = document.getElementById("btnToggleCategories"); if (btnToggleCategories) btnToggleCategories.onclick = () => { categoriesOpen = !categoriesOpen; renderAll(); };
  document.querySelectorAll("[data-rmcat]").forEach((b) => b.onclick = () => {
    const [type, name] = b.dataset.rmcat.split("|");
    persist({ ...data, categories: { ...data.categories, [type]: data.categories[type].filter((c) => c !== name) } });
  });
  const addCatEntrata = document.getElementById("addCatEntrata");
  if (addCatEntrata) addCatEntrata.onclick = () => {
    const val = document.getElementById("newCatEntrata").value.trim();
    if (!val || data.categories.entrata.includes(val)) return;
    persist({ ...data, categories: { ...data.categories, entrata: [...data.categories.entrata, val] } });
  };
  const addCatUscita = document.getElementById("addCatUscita");
  if (addCatUscita) addCatUscita.onclick = () => {
    const val = document.getElementById("newCatUscita").value.trim();
    if (!val || data.categories.uscita.includes(val)) return;
    persist({ ...data, categories: { ...data.categories, uscita: [...data.categories.uscita, val] } });
  };

  const btnExportCsv = document.getElementById("btnExportCsv"); if (btnExportCsv) btnExportCsv.onclick = exportCSV;
  const btnBackup = document.getElementById("btnBackup"); if (btnBackup) btnBackup.onclick = downloadBackup;
  const btnRestore = document.getElementById("btnRestore"); if (btnRestore) btnRestore.onclick = () => document.getElementById("restoreInput").click();

  const btnReset = document.getElementById("btnReset");
  if (btnReset) btnReset.onclick = () => {
    if (!resetArmed) { resetArmed = true; renderAll(); setTimeout(() => { resetArmed = false; renderAll(); }, 3000); return; }
    resetArmed = false;
    persist({ wallets: [], categories: { ...DEFAULT_CATEGORIES }, transactions: [] });
  };
}

function flashHero() {
  const el = document.getElementById("heroBalance");
  if (!el) return;
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 650);
}

function exportCSV() {
  const header = ["Data", "Tipo", "Categoria", "Portafoglio", "Frequenza", "Importo", "Nota"];
  const rows = data.transactions.slice().sort((a, b) => a.date.localeCompare(b.date)).map((t) => [t.date, t.type, t.category, t.wallet, t.frequency || "", t.amount.toFixed(2).replace(".", ","), (t.note || "").replace(/;/g, ",")]);
  const csv = [header, ...rows].map((r) => r.join(";")).join("\n");
  downloadBlob(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" }), "registro-conti.csv");
}
function downloadBackup() { downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }), "registro-backup.json"); }
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
document.getElementById("restoreInput").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      if (!parsed || !Array.isArray(parsed.wallets) || !Array.isArray(parsed.transactions) || !parsed.categories) throw new Error("formato non valido");
      persist(parsed);
      importMessage = { type: "ok", text: "Backup ripristinato." };
      renderAll();
    } catch (err) {
      importMessage = { type: "error", text: "Questo file non sembra un backup valido del Registro." };
      renderAll();
    }
    setTimeout(() => { importMessage = null; renderAll(); }, 4000);
  };
  reader.readAsText(file);
});

/* ---------------- boot ---------------- */
renderAll();
initFirebase();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => console.error("Registrazione service worker fallita", e));
  });
}
</script>
